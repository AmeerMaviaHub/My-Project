<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop – Nukkad</title>
<script>try{var t=localStorage.getItem('nk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="page-title"><h1>Shop</h1></div>
  <div class="toolbar" style="margin-top:1rem">
    <div id="chips" class="chips"></div>
    <div class="selects">
      <select id="brand" aria-label="Filter by brand"></select>
      <select id="sort" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
    </div>
  </div>
  <p id="count" class="count"></p>
  <div id="grid" class="grid"></div>
  <button id="more" class="btn alt more" type="button">Load more products</button>
</main>
<script src="script.js"></script>
</body>
</html>
